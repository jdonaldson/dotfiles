# Modern tmux configuration

# Default session
new-session -d -s lillypad 2>/dev/null

# Terminal & color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# General settings
set -g history-limit 50000
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename off
setw -g aggressive-resize on
set -g renumber-windows on
set -g set-titles on
set -g status-interval 1
set -g allow-passthrough on  # Kitty graphics protocol

# Bell notifications
set -g bell-action current
set -g visual-bell off

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# Adaptive status-left: resize hook swaps between compact/full
set-hook -g client-resized 'run-shell -b "bash ~/.claude/popups/adaptive_status.sh"'
set-hook -g session-created 'run-shell -b "bash ~/.claude/popups/adaptive_status.sh"'

# Adaptive refresh: snap back to 1s on user activity (idle_interval.sh slows it down)
set-hook -g pane-focus-in 'set -g status-interval 1'
set-hook -g after-select-window 'set -g status-interval 1'
set-hook -g after-select-pane 'set -g status-interval 1'

# Swap bell sound per session
set-hook -g session-window-changed 'run-shell -b "bash ~/.config/kitty/swap_bell.sh"'

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Status bar position (default bottom; hooks move to top on new session)
set -g status-position bottom

# Pane border configuration (for Claude Code)
set-option -g pane-border-status top
set-option -g pane-border-lines double
set-option -g pane-border-format '#{?pane_active,#[fg=#a7c080]#[bold]╣ #{pane_index}: #{pane_title} ╠#[default],#[fg=#859289]╣ #{pane_index}: #{pane_title} ╠#[default]}'
set-option -g allow-rename off

# Auto-update window names from pane titles or directory
# set-hook -g pane-title-changed 'run-shell -b "bash ~/.claude/popups/refresh_windows.sh"'
# set-hook -g window-renamed 'run-shell -b "bash ~/.claude/popups/refresh_windows.sh"'

# Vi mode for copy
setw -g mode-keys vi

# Copy to system clipboard (macOS)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Key bindings - window management
bind -n C-t new-window
bind -n C-PgDn next-window
bind -n C-PgUp previous-window
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1
bind -n C-M-w kill-window
bind -n C-M-q confirm -p "Kill this tmux session?" kill-session
bind -n F11 resize-pane -Z

# Window switcher popup (fzf)
bind j run-shell "bash ~/.claude/popups/window_switcher.sh"

# Window cycling (forward/back)
bind h previous-window
bind l next-window
bind C-a next-window

# Pane navigation
bind k select-pane -t :.+

# 25% splits (Ctrl-a u = above, Ctrl-a m = below)
bind u split-window -vb -p 25 -c "#{pane_current_path}"
bind m split-window -v -p 25 -c "#{pane_current_path}"

# 33% splits (Ctrl-a , = left, Ctrl-a . = right)
bind , split-window -hb -p 33 -c "#{pane_current_path}"
bind . split-window -h -p 33 -c "#{pane_current_path}"

# Standard splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Override default split keys to use current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Click session name to open session switcher
bind -n MouseDown1StatusLeft choose-tree -s

# Spotify controls (prefix keys + click on status bar icon)
bind p run-shell "osascript -e 'tell application \"Spotify\" to playpause'"
bind -n MouseDown1Status \
  if -F '#{==:#{mouse_status_range},cpu}' { display-popup -T " CPU (q to close) " -w 90% -h 80% -E "btop --preset 0" } { \
  if -F '#{==:#{mouse_status_range},mem}' { display-popup -T " Memory (q to close) " -w 90% -h 80% -E "btop --preset 1" } { \
  if -F '#{==:#{mouse_status_range},net}' { display-popup -T " Network (q to close) " -w 90% -h 80% -E "sudo bandwhich" } { \
  if -F '#{==:#{mouse_status_range},spotify}' { run-shell "osascript -e 'tell application \"Spotify\" to playpause'" } { \
  if -F '#{==:#{mouse_status_range},slack}' { run-shell "open -a Slack" } { \
  select-window -t = } } } } }
bind > run-shell "osascript -e 'tell application \"Spotify\" to next track'"
bind < run-shell "osascript -e 'tell application \"Spotify\" to previous track'"
bind + run-shell "osascript -e 'set volume output volume ((output volume of (get volume settings)) + 10)'"
bind - run-shell "osascript -e 'set volume output volume ((output volume of (get volume settings)) - 10)'"

# Slack controls
bind s display-popup -T " Slack Status " -w 40% -h 30% -E "bash ~/.claude/popups/slack_set_status.sh"
bind S run-shell "bash ~/.claude/popups/slack_toggle_presence.sh"

# Opacity picker (fzf live preview)
bind o display-popup -E -w 30 -h 14 -T " Opacity " "bash ~/.claude/popups/opacity_picker.sh"

# Reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# Color scheme (Everforest Dark Hard — Powerline)
# Palette:
#   bg_dim=#232a2e  bg=#272e33  bg1=#2e383c  bg2=#374145
#   fg=#d3c6aa  gray=#859289  green=#a7c080  blue=#7fbbb3
#   yellow=#dbbc7f  orange=#e69875  red=#e67e80  purple=#d699b6

set -g status-style 'bg=default fg=#859289'
set -g pane-border-style 'fg=#4f5b58'
set -g pane-active-border-style 'fg=#a7c080'
set -g message-style 'bg=#374145 fg=#d3c6aa'
set -g message-command-style 'bg=#374145 fg=#d3c6aa'

# No separator — powerline arrows handle transitions
set -g window-status-separator ''

# Status left: adaptive — set by ~/.claude/popups/adaptive_status.sh
# Narrow (<180 cols): just frog emoji pill. Wide (>=180): frog + session name + hostname pill.
set -g status-left '#(bash ~/.claude/popups/update_labels.sh >/dev/null)#[fg=#a7c080,bg=default]#[bg=#a7c080,fg=#232a2e,bold] 🐸 #S #[fg=#a7c080,bg=#374145]#[fg=#d3c6aa,bg=#374145] 💻 #h #[fg=#374145,bg=default] '
set -g status-left-length 80

# Status right: sparkline + date in gray, time in blue pill — rounded outer edges
set -g status-right '#[fg=#374145,bg=default]#[range=user|spotify]#[fg=#1DB954,bg=#374145]  #[fg=#d699b6]#(bash ~/.claude/popups/now_playing.sh) #[norange]#[fg=#374145,bg=default] #[fg=#374145,bg=default]#[bg=#374145]#[range=user|slack]#[fg=#e67e80,bg=#374145] #(printf '\uf198')#[fg=#d3c6aa] #(bash ~/.claude/popups/slack_unread.sh) #[norange]#[fg=#4f5b58]⡇ #[range=user|cpu]#[fg=#a7c080]#(printf '\uf2db') #(bash ~/.claude/popups/sparkline.sh)#[norange] #[fg=#4f5b58]⡇ #[range=user|net]#[fg=#e69875]#(printf '\uf1eb') #(bash ~/.claude/popups/sparkline_net.sh)#[norange] #[fg=#4f5b58]⡇ #[range=user|mem]#[fg=#7fbbb3]#(printf '\uf233') #(bash ~/.claude/popups/sparkline_mem.sh)#[norange] #[fg=#4f5b58]⡇ #[fg=#dbbc7f]#(bash ~/.claude/popups/weather.sh) #[fg=#4f5b58]⡇ #[fg=#859289] %d %b #[fg=#374145,bg=default] #[fg=#7fbbb3,bg=default]#[fg=#232a2e,bg=#7fbbb3,bold] #(bash ~/.claude/popups/clock_emoji.sh) %I:%M%p #[fg=#7fbbb3,bg=default] '
set -g status-right-length 180
set -g status-justify left

# Inactive windows: muted pills with rounded edges
setw -g window-status-format '#[fg=#2e383c,bg=default]#[fg=#859289,bg=#2e383c] #I #(cat ~/.claude/popups/status/#{pane_pid} 2>/dev/null)#(cat ~/.claude/popups/labels/#{pane_pid} 2>/dev/null) #[fg=#2e383c,bg=default]'
# Active window: green pill with rounded edges
setw -g window-status-current-format '#[fg=#a7c080,bg=default]#[fg=#232a2e,bg=#a7c080,bold] #I #(cat ~/.claude/popups/status/#{pane_pid} 2>/dev/null)#(cat ~/.claude/popups/labels/#{pane_pid} 2>/dev/null) #[fg=#a7c080,bg=default]'
# Activity/bell
set -g window-status-activity-style ''
set -g window-status-bell-style ''
