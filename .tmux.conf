# Modern tmux configuration
# Shared core — platform-specific config lives in ~/.tmux.conf.macos / ~/.tmux.conf.linux
# (sourced at the bottom of this file).

# Terminal & color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# General settings
set -g history-limit 50000
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename off
setw -g aggressive-resize on
set -g renumber-windows on
set -g set-titles on
set -g status-interval 1
set -g allow-passthrough on  # Kitty graphics protocol

# Bell notifications
set -g bell-action current
set -g visual-bell off

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# Adaptive refresh: snap back to 1s on user activity (idle_interval.sh slows it down)
set-hook -g pane-focus-in 'set -g status-interval 1'
set-hook -g after-select-window 'set -g status-interval 1'
set-hook -g after-select-pane 'set -g status-interval 1'

# Status bar position (default bottom; hooks move to top on new session)
set -g status-position bottom

# Pane border configuration (for Claude Code)
set-option -g pane-border-status top
set-option -g pane-border-lines double
set-option -g pane-border-format '#{?pane_active,#[fg=#a7c080]#[bold]╣ #{pane_index}: #{pane_title} ╠#[default],#[fg=#859289]╣ #{pane_index}: #{pane_title} ╠#[default]}'
set-option -g allow-rename off

# Auto-update window names from pane titles or directory
# set-hook -g pane-title-changed 'run-shell -b "bash ~/.claude/popups/refresh_windows.sh"'
# set-hook -g window-renamed 'run-shell -b "bash ~/.claude/popups/refresh_windows.sh"'

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Key bindings - window management
bind -n C-t new-window
bind -n C-PgDn next-window
bind -n C-PgUp previous-window
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1
bind -n C-M-w kill-window
bind -n C-M-q confirm -p "Kill this tmux session?" kill-session
bind -n F11 resize-pane -Z

# Window cycling (forward/back)
bind h previous-window
bind l next-window
bind C-a next-window

# Pane navigation
bind k select-pane -t :.+

# 25% splits (prefix u = above, prefix m = below)
bind u split-window -vb -p 25 -c "#{pane_current_path}"
bind m split-window -v -c "#{pane_current_path}"

# 33% splits (prefix , = left, prefix . = right)
bind , split-window -hb -p 33 -c "#{pane_current_path}"
bind . split-window -h -p 33 -c "#{pane_current_path}"

# Standard splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Override default split keys to use current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Click session name to open session switcher
bind -n MouseDown1StatusLeft choose-tree -s

# Reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# Color scheme (Everforest Dark Hard — Powerline)
# Palette:
#   bg_dim=#232a2e  bg=#272e33  bg1=#2e383c  bg2=#374145
#   fg=#d3c6aa  gray=#859289  green=#a7c080  blue=#7fbbb3
#   yellow=#dbbc7f  orange=#e69875  red=#e67e80  purple=#d699b6

set -g status-style 'bg=default fg=#859289'
set -g pane-border-style 'fg=#4f5b58'
set -g pane-active-border-style 'fg=#a7c080'
set -g message-style 'bg=#374145 fg=#d3c6aa'
set -g message-command-style 'bg=#374145 fg=#d3c6aa'

# No separator — powerline arrows handle transitions
set -g window-status-separator ''

# Activity/bell
set -g window-status-activity-style ''
set -g window-status-bell-style ''

# Platform-specific config: prefix key, clipboard, status bar, integrations.
# macOS keeps prefix C-a; Linux servers use stock C-b so SSH-nested sessions
# don't fight the outer (local) tmux for the prefix.
if-shell "uname | grep -q Darwin" "source-file ~/.tmux.conf.macos" "source-file ~/.tmux.conf.linux"
